<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA Gemini</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .user { background: #3b82f6; align-self: flex-end; margin-left: auto; }
        .ai { background: #334155; align-self: flex-start; }
        .input-area { padding: 20px; background: #1e293b; display: flex; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Dis quelque chose...">
        <button onclick="sendMessage()">ENVOYER</button>
    </div>

    <script>
        const API_KEY = "AIzaSyDHpWiCOiemOxzoe0V4Jt8QTff19pTjCVE"; // <--- METS TA CLÉ ICI

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            // Afficher message utilisateur
            chatBox.innerHTML += `<div class="msg user">${input.value}</div>`;
            
            const prompt = input.value;
            input.value = "";

            // Appel à l'IA Gemini
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                // Afficher réponse IA
                chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai">Erreur : Vérifie ta clé ou ta connexion.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
