<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Gemini Final</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 15px; padding: 12px; border-radius: 10px; max-width: 85%; line-height: 1.4; word-wrap: break-word; }
        .user { background: #3b82f6; align-self: flex-end; margin-left: auto; }
        .ai { background: #334155; align-self: flex-start; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; outline: none; background: #f1f5f9; color: #000; }
        button { padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-box">
        <div class="msg ai">Système prêt. Testons la connexion avec ta nouvelle clé.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Écris ton message...">
        <button onclick="sendMessage()">ENVOYER</button>
    </div>

    <script>
        // REMPLACE CECI PAR TA NOUVELLE CLÉ VALIDE
        const API_KEY = "AIzaSyCKFN35EmZODXHPavxWwcqgy2qTbbhVNh4"; 

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const prompt = input.value.trim();
            
            if (!prompt) return;

            chatBox.innerHTML += `<div class="msg user">${prompt}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Utilisation de v1beta qui est plus flexible pour le modèle flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // Affiche l'objet d'erreur complet pour le diagnostic final
                    alert("ERREUR DÉTECTÉE :\n" + data.error.message);
                    chatBox.innerHTML += `<div class="msg ai" style="color:#f87171">Erreur : ${data.error.message}</div>`;
                } else if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
                } else {
                    alert("Réponse inattendue de l'API. Vérifie tes quotas.");
                }
            } catch (error) {
                alert("ERREUR RÉSEAU : " + error.message);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
